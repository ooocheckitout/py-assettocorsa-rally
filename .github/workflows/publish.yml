name: publish

on:
  release:
    types: [published]

jobs:
  typecheck:
    runs-on: windows-latest # acrally imports ctypes.WinDLL
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8" # oldest supported
      - run: python -m pip install mypy && python -m mypy acrally
      - run: python -c "import acrally.memory"

  publish:
    needs: typecheck
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # setuptools-scm needs tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
